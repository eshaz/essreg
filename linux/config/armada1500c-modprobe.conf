#
# snd-es1869 on the Compaq Armada 1500c, in place of snd-es18xx: the
# resources DOS and Windows use, and the card first, so that hw:0 and
# asound.state's state.ES1869 still fit. For /etc/modprobe.d/.
#
# (c) 2026 Ethan Halsall <ethan.s.halsall@gmail.com>

blacklist snd-es18xx

options snd-es1869 index=0 isapnp=0 port=0x220 irq=5 dma1=1 dma2=5
options snd-es1869 fm_port=0x388 mpu_port=0x330

# The DAC stages off. 1 is ESS's setting of each:
#   audio2_oversampling=1  Audio 2's 4x oversampling (71h bit 4)
#   audio2_filter=1        Audio 2's switched-capacitor filter (71h bit 3)
#   audio1_filter=1        Audio 1's filter, which is also the ADC's
#                          anti-alias filter (71h bit 2)
# alsactl restores the three controls at boot, after the module, so the
# saved state (armada1500c-asound.state) decides once it has them.
options snd-es1869 audio2_oversampling=0 audio2_filter=0 audio1_filter=0

# The Armada's two volume buttons are wired for the chip's 2-wire mode, in
# which both pressed together are the mute (64h bits 3:2 = 01, DS p.25);
# the default 3-wire mode wants a third button for the mute.
options snd-es1869 hwvol_mode=1

# piix4_type_f=0, the default, takes the PIIX4's Type F DMA timing off DMA
# 1: with it, the first byte a recording moves hangs the machine.

# An Opcode MIDIEngine 2Port/SE on the parallel port, which the BIOS leaves
# off: linux/tools/mqengine-up.sh turns the port on and loads snd-mqengine,
# whose defaults are this port and IRQ. Blacklist parport_pc and leave
# snd-mtpav out, which would take the same port.

# A MOTU PC-MIDI Flyer there instead: linux/tools/flyer-up.sh turns the port
# on and loads snd-flyer, with the same defaults, and turns it off again with
# "off". Only one of the two drivers can have the port.
